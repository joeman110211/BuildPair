name: BuildPair End-to-End

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS BuildPair staging URL to test'
        required: false
        default: 'https://staging.buildpair.co.uk'
        type: string
      external_integrations:
        description: 'Also exercise Gemini and Cloudinary integration checks'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: buildpair-e2e-${{ inputs.base_url || 'staging' }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://staging.buildpair.co.uk' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_EXTERNAL: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.external_integrations) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Validate staging target and Clerk test access
        shell: bash
        run: |
          set -euo pipefail
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "::error::base_url must start with https://"; exit 1 ;;
          esac

          host=$(printf '%s' "$E2E_BASE_URL" | sed -E 's#^https://([^/]+).*$#\1#' | tr '[:upper:]' '[:lower:]')
          case "$host" in
            buildpair.co.uk|www.buildpair.co.uk)
              echo "::error::Mutating E2E tests are forbidden against production. Use https://staging.buildpair.co.uk."
              exit 1
              ;;
          esac

          if [ "$host" != "staging.buildpair.co.uk" ]; then
            echo "::error::Mutating BuildPair E2E tests may only target staging.buildpair.co.uk."
            exit 1
          fi

          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Add the Clerk secret key for the staging BuildPair Clerk instance as an Actions secret named CLERK_SECRET_KEY before running E2E."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Wait for exact deployed revision and readiness
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            expected_sha="$GITHUB_SHA"
          fi

          for attempt in $(seq 1 120); do
            health=$(curl --fail --silent --show-error --connect-timeout 3 --max-time 8 "$E2E_BASE_URL/api/health" 2>/dev/null || true)
            readiness=$(curl --fail --silent --show-error --connect-timeout 3 --max-time 8 "$E2E_BASE_URL/api/readiness" 2>/dev/null || true)
            deployed_sha=$(printf '%s' "$health" | jq -r '.releaseSha // empty' 2>/dev/null || true)
            ready=$(printf '%s' "$readiness" | jq -r '.ready // false' 2>/dev/null || true)

            if [ "$ready" = "true" ]; then
              if [ -z "$expected_sha" ] || [ "$deployed_sha" = "$expected_sha" ]; then
                echo "BuildPair staging target is ready at ${deployed_sha:-current deployed revision}."
                exit 0
              fi
            fi

            if [ -n "$expected_sha" ]; then
              echo "Waiting for deployed ${expected_sha:0:12}; currently ${deployed_sha:0:12} ($attempt/120)..."
            else
              echo "Waiting for target readiness ($attempt/120)..."
            fi
            sleep 5
          done

          echo "::error::BuildPair staging target did not reach the required ready revision in time"
          exit 1

      - name: Load target Clerk publishable key
        shell: bash
        run: |
          set -euo pipefail
          config=$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$E2E_BASE_URL/api/client-config")
          key=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty')
          if [ -z "$key" ]; then
            echo "::error::Target Clerk publishable key is missing"
            exit 1
          fi
          echo "CLERK_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install isolated E2E tooling
        run: npm install --no-save --package-lock=false @playwright/test@latest @clerk/testing@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run every BuildPair browser journey and feature matrix
        run: npx playwright test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-e2e-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
