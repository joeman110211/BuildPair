name: Validate patched URL decoder and refresh lockfile

on:
  push:
    branches:
      - security/patched-uri-decoder-20261011

permissions:
  contents: write

concurrency:
  group: refresh-uri-decoder-lock
  cancel-in-progress: false

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - name: Match repository npm version
        run: npm install --global npm@11.19.0
      - name: Regenerate reproducible lockfile for local decoder bridge
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        run: npm ci --no-audit --no-fund
      - name: Check compatibility and regression tests
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build:web
      - name: Bundle Android and iOS JavaScript for native resolver compatibility
        run: |
          npx expo export --platform android --output-dir dist-android-compat
          npx expo export --platform ios --output-dir dist-ios-compat
      - name: Verify audited decoder no longer appears as vulnerable
        shell: bash
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e "const a=require('./audit.json');const v=a.metadata?.vulnerabilities; if(!v || v.high>18 || v.moderate>3) process.exit(1); for(const name of ['decode-uri-component','query-string','expo-router']) {if(a.vulnerabilities?.[name]) { console.error(name+' still reported'); process.exit(1) }} console.log('Remaining high:',v.high,'moderate:',v.moderate)"
          rm audit.json
      - name: Commit checked lockfile to the review branch only
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'deps: lock patched decoder bridge after CI validation'
            git push origin HEAD:security/patched-uri-decoder-20261011
          fi
