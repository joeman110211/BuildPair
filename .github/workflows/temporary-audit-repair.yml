name: Temporary Dependency Audit Repair
on:
  push:
    branches: [launch-prep-regional-20261008]
    paths: ['.github/workflows/temporary-audit-repair.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Repair only compatible production dependency lockfile versions
        shell: bash
        run: |
          npm audit fix --package-lock-only --omit=dev --audit-level=high || true
          git diff --stat -- package-lock.json
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: refresh compatible dependency lockfile versions'
          git push origin HEAD:launch-prep-regional-20261008
