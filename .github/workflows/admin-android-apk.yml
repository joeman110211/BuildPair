name: Build Admin Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'HTTPS BuildPair production API origin'
        required: false
        default: 'https://www.buildpair.co.uk'
        type: string
  push:
    branches: [feature/admin-mobile-apk]
    paths:
      - 'admin-mobile/**'
      - '.github/workflows/admin-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: buildpair-admin-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_ADMIN_API_URL: ${{ inputs.api_url || 'https://www.buildpair.co.uk' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1

      - name: Align npm with BuildPair toolchain
        run: npm install --global npm@11.19.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate admin API target
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPO_PUBLIC_ADMIN_API_URL" in
            https://*) ;;
            *) echo "::error::api_url must start with https://"; exit 1 ;;
          esac

      - name: Resolve Clerk client configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            config=$(curl --fail --show-error --silent --retry 8 --retry-delay 3 "$EXPO_PUBLIC_ADMIN_API_URL/api/client-config")
            clerk=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty')
            if [ -n "$clerk" ]; then
              echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$clerk" >> "$GITHUB_ENV"
            fi
          fi
          test -n "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-$(grep '^EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=' "$GITHUB_ENV" 2>/dev/null | cut -d= -f2-)}" || { echo "::error::BuildPair client config did not provide a Clerk publishable key"; exit 1; }

      - name: Install admin app dependencies
        working-directory: admin-mobile
        run: npm install --include=dev --no-audit --no-fund

      - name: Typecheck admin app
        working-directory: admin-mobile
        run: npm run typecheck

      - name: Generate native Android project
        working-directory: admin-mobile
        run: npx expo prebuild --platform android --clean

      - name: Verify Expo autolinking
        working-directory: admin-mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo-modules-autolinking verify --verbose
          npx expo-modules-autolinking react-native-config --json --platform android > /tmp/buildpair-admin-rn-config.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/buildpair-admin-rn-config.json', 'utf8'));
          console.log(`Expo autolinking resolved ${Object.keys(config.dependencies || {}).length} React Native modules.`);
          NODE

      - name: Tune Android release build
        working-directory: admin-mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8/' gradle.properties
          if grep -q '^reactNativeArchitectures=' gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' gradle.properties
          else
            printf '\nreactNativeArchitectures=armeabi-v7a,arm64-v8a\n' >> gradle.properties
          fi

      - name: Build installable admin APK
        working-directory: admin-mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace --info

      - name: Verify admin APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find admin-mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$apk" || { echo "::error::Admin APK was not produced"; exit 1; }
          unzip -t "$apk" >/dev/null
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/buildpair-admin-apk-badging.txt
          grep -q "package: name='uk.co.buildpair.admin'" /tmp/buildpair-admin-apk-badging.txt || { echo "::error::Unexpected admin Android application id"; exit 1; }
          grep -q "application-label:'BuildPair Admin'" /tmp/buildpair-admin-apk-badging.txt || { echo "::error::Unexpected admin Android application label"; exit 1; }

      - name: Upload BuildPair Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-admin-android-apk
          path: admin-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build x86_64 release for launch smoke test
        working-directory: admin-mobile/android
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' gradle.properties
          ./gradlew clean assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch-test admin APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            apk=$(find admin-mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
            test -n "$apk" || { echo "::error::x86_64 admin APK was not produced"; exit 1; }
            adb install -r "$apk"
            adb logcat -c
            adb shell am force-stop uk.co.buildpair.admin || true
            activity=$(adb shell cmd package resolve-activity --brief uk.co.buildpair.admin | tr -d '\r' | tail -1)
            test -n "$activity" || { echo "::error::Could not resolve BuildPair Admin launch activity"; exit 1; }
            echo "Launching $activity"
            adb shell am start -W -n "$activity" | tee /tmp/buildpair-admin-am-start.txt
            sleep 12
            adb logcat -d -v threadtime > /tmp/buildpair-admin-launch-logcat.txt
            pid=$(adb shell pidof uk.co.buildpair.admin | tr -d '\r' || true)
            if [ -z "$pid" ]; then
              echo "::error::BuildPair Admin process exited after launch"
              grep -E 'AndroidRuntime|FATAL EXCEPTION|ReactNativeJS|Expo|Clerk|uk\.co\.buildpair\.admin' /tmp/buildpair-admin-launch-logcat.txt | tail -250 || true
              exit 1
            fi
            if grep -Eq 'FATAL EXCEPTION.*uk\.co\.buildpair\.admin|Process: uk\.co\.buildpair\.admin.*FATAL EXCEPTION' /tmp/buildpair-admin-launch-logcat.txt; then
              echo "::error::BuildPair Admin emitted a fatal runtime exception"
              grep -E 'AndroidRuntime|FATAL EXCEPTION|ReactNativeJS|Expo|Clerk|uk\.co\.buildpair\.admin' /tmp/buildpair-admin-launch-logcat.txt | tail -250 || true
              exit 1
            fi
            resumed=$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'uk.co.buildpair.admin' || true)
            test -n "$resumed" || { echo "::error::BuildPair Admin is alive but not the resumed foreground activity"; exit 1; }
            echo "BuildPair Admin stayed alive and foregrounded after release launch (pid=$pid)."

      - name: Upload admin launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-admin-launch-diagnostics
          path: |
            /tmp/buildpair-admin-launch-logcat.txt
            /tmp/buildpair-admin-am-start.txt
          if-no-files-found: warn
          retention-days: 14
