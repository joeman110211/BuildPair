name: Build Admin Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'HTTPS BuildPair API/web origin to embed in the admin APK'
        required: false
        default: 'https://buildpair.onrender.com'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-android-apk.yml'
      - 'app/admin/**'
      - 'app/auth/**'
      - 'app/(public)/index.tsx'
      - 'components/AdminGate.tsx'
      - 'components/Screen.tsx'
      - 'hooks/useCurrentUser.ts'
      - 'lib/api.ts'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: buildpair-admin-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      EXPO_PUBLIC_ADMIN_APP: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://buildpair.onrender.com' }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: qrrcn7ma

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate target URL
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "::error::api_url must start with https://"; exit 1 ;;
          esac

      - name: Resolve client-safe configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" ]; then
            config=$(curl --fail --show-error --silent --retry 8 --retry-delay 3 "$EXPO_PUBLIC_API_URL/api/client-config")
            clerk=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty')
            stripe=$(printf '%s' "$config" | jq -r '.stripePublishableKey // empty')
            if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && [ -n "$clerk" ]; then
              echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$clerk" >> "$GITHUB_ENV"
            fi
            if [ -z "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" ] && [ -n "$stripe" ]; then
              echo "EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=$stripe" >> "$GITHUB_ENV"
            fi
          fi

      - name: Require admin client configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "::error::Missing EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY in GitHub Actions and target client config"; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::Missing EXPO_PUBLIC_API_URL"; exit 1; }

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Configure separate admin application identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.name = 'BuildPair Admin';
          config.expo.slug = 'buildpair-admin';
          config.expo.scheme = 'buildpair-admin';
          config.expo.android.package = 'uk.co.buildpair.admin';
          fs.writeFileSync('app.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Generate native Android admin project
        run: npx expo prebuild --platform android --clean

      - name: Tune Android release build for GitHub runner
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8/' gradle.properties
          if grep -q '^reactNativeArchitectures=' gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' gradle.properties
          else
            echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> gradle.properties
          fi
          echo 'org.gradle.workers.max=2' >> gradle.properties

      - name: Build installable admin release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace --info

      - name: Verify admin APK integrity and identity
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$apk" || { echo "::error::Admin release APK was not produced"; exit 1; }
          unzip -t "$apk" >/dev/null
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$build_tools/aapt" || { echo "::error::Android aapt tool not found"; exit 1; }
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/buildpair-admin-apk-badging.txt
          grep -q "package: name='uk.co.buildpair.admin'" /tmp/buildpair-admin-apk-badging.txt || { echo "::error::Unexpected Android admin application id"; exit 1; }
          grep -q "application-label:'BuildPair Admin'" /tmp/buildpair-admin-apk-badging.txt || { echo "::error::Unexpected Android admin application label"; exit 1; }
          echo "BuildPair Admin Android release APK passed ZIP integrity and manifest identity checks."

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-admin-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
