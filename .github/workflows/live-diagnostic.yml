name: Verify Restored BuildPair Build

on:
  push:
    branches:
      - diagnostic-live

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install and build restored app
        shell: bash
        run: |
          npm install --global npm@11.19.0
          npm ci --no-audit --no-fund
          npm run build:web
      - name: Start restored production server
        shell: bash
        run: |
          NODE_ENV=production PORT=3000 npm run serve:production > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/server.log
          exit 1
      - name: Render restored homepage in Chrome
        shell: bash
        run: |
          set +e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --enable-logging=stderr \
            --v=0 \
            --dump-dom \
            'http://127.0.0.1:3000/' \
            > /tmp/restored-dom.html 2> /tmp/restored-chrome.err
          code=$?
          echo "Chrome exit: $code"
          echo '===== DOM size ====='
          wc -c /tmp/restored-dom.html
          echo '===== Visible BuildPair markers ====='
          grep -Eo 'BuildPair|Find Trades|How It Works|Join Waitlist|Public preview' /tmp/restored-dom.html | sort | uniq -c || true
          echo '===== Runtime errors ====='
          grep -Ei 'Uncaught|TypeError|ReferenceError|SyntaxError|CSSStyleDeclaration|failed to set an indexed property' /tmp/restored-chrome.err || true
          echo '===== Server log ====='
          tail -100 /tmp/server.log || true
          if grep -Eqi 'Uncaught|TypeError|ReferenceError|SyntaxError|CSSStyleDeclaration|failed to set an indexed property' /tmp/restored-chrome.err; then
            exit 1
          fi
          test -s /tmp/restored-dom.html
