name: Verify Production White Screen Hotfix

on:
  push:
    branches:
      - hotfix-production-white-screen

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install and build
        run: |
          npm install --global npm@11.19.0
          npm ci --no-audit --no-fund
          npm run build:web
      - name: Serve static client
        run: |
          npx --yes serve@14 dist/client -l 4173 >/tmp/serve.log 2>&1 &
          echo $! >/tmp/serve.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/serve.log
          exit 1
      - name: Chrome runtime check
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          cat > check-hotfix.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1500);
          const text = await page.locator('body').innerText();
          console.log('BODY:', text.slice(0, 1200));
          console.log('ERRORS:', JSON.stringify(errors));
          if (!text.trim()) throw new Error('Homepage rendered blank');
          if (errors.some(e => e.includes('CSSStyleDeclaration') || e.includes('indexed property'))) throw new Error('CSSStyleDeclaration regression still present');
          await browser.close();
          EOF
          node check-hotfix.mjs
