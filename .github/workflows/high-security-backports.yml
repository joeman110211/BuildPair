name: Reviewed security fork verification

on:
  push:
    branches:
      - security/patch-high-root-vulns-20261011
  pull_request:
    branches: [main]
    paths:
      - package.json
      - scripts/patch-security-dependencies.cjs
      - __tests__/securityTransitivePatches.test.ts
      - .github/workflows/high-security-backports.yml

permissions:
  contents: read

jobs:
  verify-backports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Install pinned, locally patched dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify patched dependency files
        run: npm run verify:security-patches
      - name: Verify application
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build:web
      - name: Verify native JavaScript bundling
        run: |
          npx expo export --platform android --output-dir dist-android-security
          npx expo export --platform ios --output-dir dist-ios-security
      - name: Reject any production dependency advisories
        run: |
          npm audit --omit=dev --json > dependency-audit.json || true
          node -e "const a=require('./dependency-audit.json');const v=a.metadata?.vulnerabilities;if(!v||v.critical||v.moderate||v.high)process.exit(1);console.log('Production dependency audit clear',v)"
          rm dependency-audit.json
