# BuildPair is live. Propose updates; never auto-merge framework or payment changes.
# npm/Expo upgrades must pass Quality, web hydration, and native regression tests.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:20"
      timezone: "Europe/London"
    open-pull-requests-limit: 6
    groups:
      # Review cross-cutting security fixes together, not as mismatched Expo versions.
      native-framework-security:
        applies-to: security-updates
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@stripe/stripe-react-native"
          - "@clerk/expo"
      # Patches to related native packages need one coordinated build/test cycle.
      native-framework-patches:
        applies-to: version-updates
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@stripe/stripe-react-native"
          - "@clerk/expo"
        update-types:
          - "patch"
      other-safe-patches:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@stripe/stripe-react-native"
          - "@clerk/expo"
        update-types:
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
