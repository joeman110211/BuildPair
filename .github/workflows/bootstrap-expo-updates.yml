name: Bootstrap Expo Updates dependency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-expo-updates.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Install existing dependencies
        run: npm ci --include=dev --no-audit --no-fund --prefer-offline

      - name: Add Expo Updates for SDK 57
        run: npx expo install expo-updates

      - name: Commit dependency and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "expo-updates dependency already present"
            exit 0
          fi
          git commit -m "Add Expo Updates dependency"
          git push origin HEAD:main
