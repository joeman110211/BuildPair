name: Homepage hero browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/LandingPageRefined.tsx'
      - 'e2e/homepage-hero-smoke.mjs'
      - '.github/workflows/homepage-hero-smoke.yml'

permissions:
  contents: read

concurrency:
  group: hero-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      PORT: '3000'
      APP_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      BUILDPAIR_NOINDEX: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - name: Use repository npm
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Build production web bundle
        run: npm run build:web
      - name: Install isolated browser runner
        run: npm install --no-save --package-lock=false @playwright/test@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start built web server
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production node server.mjs >/tmp/buildpair-homepage-smoke.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/buildpair-homepage-smoke.log
          exit 1
      - name: Confirm homepage survives hydration across mobile and desktop
        run: node e2e/homepage-hero-smoke.mjs
      - name: Save browser evidence and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-hero-smoke-${{ github.run_id }}
          path: |
            ui-evidence/
            /tmp/buildpair-homepage-smoke.log
          if-no-files-found: ignore
          retention-days: 7
