name: BuildPair End-to-End

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS live BuildPair production URL to test'
        required: false
        default: 'https://www.buildpair.co.uk'
        type: string
      confirm_mutating:
        description: 'I approve clearly labelled temporary production test accounts, records and cleanup'
        required: true
        default: false
        type: boolean
      external_integrations:
        description: 'Also exercise Gemini and Cloudinary integration checks'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: buildpair-e2e-production
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://www.buildpair.co.uk' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_EXTERNAL: ${{ inputs.external_integrations && '1' || '0' }}
      E2E_PRODUCTION_MUTATION_ACK: ${{ inputs.confirm_mutating && 'I_APPROVE_DISPOSABLE_PRODUCTION_TESTS' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Require explicit mutating-test approval
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_mutating }}" != "true" ]; then
            echo "::error::Mutating E2E is disabled by default. Re-run manually with confirm_mutating enabled only when temporary production test records and cleanup are authorised."
            exit 1
          fi

      - name: Validate protected production target and Clerk test access
        shell: bash
        run: |
          set -euo pipefail
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "::error::base_url must start with https://"; exit 1 ;;
          esac
          host=$(printf '%s' "$E2E_BASE_URL" | sed -E 's#^https://([^/]+).*$#\1#' | tr '[:upper:]' '[:lower:]')
          if [ "$host" != "www.buildpair.co.uk" ]; then
            echo "::error::Mutating E2E can only target https://www.buildpair.co.uk."
            exit 1
          fi
          if [ "$E2E_PRODUCTION_MUTATION_ACK" != "I_APPROVE_DISPOSABLE_PRODUCTION_TESTS" ]; then
            echo "::error::Explicit production data/cleanup approval is required."
            exit 1
          fi
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Add the PRODUCTION BuildPair Clerk secret as Actions secret CLERK_SECRET_KEY before running E2E."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Wait for production readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            readiness=$(curl --fail --silent --show-error --connect-timeout 3 --max-time 8 "$E2E_BASE_URL/api/readiness" 2>/dev/null || true)
            ready=$(printf '%s' "$readiness" | jq -r '.ready // false' 2>/dev/null || true)
            if [ "$ready" = "true" ]; then
              echo "BuildPair production target is ready."
              exit 0
            fi
            echo "Waiting for target readiness ($attempt/120)..."
            sleep 5
          done
          echo "::error::BuildPair production target did not become ready in time"
          exit 1

      - name: Load target Clerk publishable key
        shell: bash
        run: |
          set -euo pipefail
          config=$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$E2E_BASE_URL/api/client-config")
          key=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty')
          if [ -z "$key" ]; then
            echo "::error::Target Clerk publishable key is missing"
            exit 1
          fi
          echo "CLERK_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install isolated E2E tooling
        run: npm install --no-save --package-lock=false @playwright/test@latest @clerk/testing@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run curated production-safe authenticated feature and mobile matrix
        run: npx playwright test --project=desktop-core-flow --project=desktop-marketplace-features --project=desktop-onboarding-validation --project=desktop-abuse-security --project=desktop-dual-mode --project=desktop-route-coverage --project=small-android-route-coverage --project=small-android-public-ui

      - name: Retry cleanup of disposable production test accounts
        if: always()
        shell: bash
        run: |
          if [ -f playwright/.e2e-users.json ] && [ -x node_modules/.bin/playwright ]; then
            npx playwright test --project=cleanup
          fi

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-e2e-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
