name: BuildPair Production Smoke

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: buildpair-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://www.buildpair.co.uk
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Wait for production deployment and client configuration
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          release=''

          for attempt in $(seq 1 30); do
            health=$(curl --silent --show-error --max-time 15 "$BASE_URL/api/health" || printf '{}')
            config=$(curl --silent --show-error --max-time 15 "$BASE_URL/api/client-config" || printf '{}')

            status=$(printf '%s' "$health" | jq -r '.status // empty' 2>/dev/null || true)
            database=$(printf '%s' "$health" | jq -r '.database // empty' 2>/dev/null || true)
            release=$(printf '%s' "$health" | jq -r '.releaseSha // empty' 2>/dev/null || true)
            clerk=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty' 2>/dev/null || true)

            revision_ready=1
            if [ -n "$release" ] && [ "$release" != "$EXPECTED_SHA" ]; then
              revision_ready=0
            fi

            if [ "$status" = 'ok' ] && [ "$database" = 'ok' ] && [ -n "$clerk" ] && [ "$revision_ready" -eq 1 ]; then
              ready=1
              break
            fi

            echo "Production is not fully ready yet (attempt $attempt/30; health=${status:-missing}; db=${database:-missing}; release=${release:-not-exposed}; client_config=$([ -n "$clerk" ] && echo ready || echo waiting))."
            sleep 10
          done

          test "$ready" -eq 1 || { echo "::error::Production did not become healthy with usable client configuration inside the deployment window"; exit 1; }

          if [ -n "$release" ]; then
            test "$release" = "$EXPECTED_SHA" || { echo "::error::Production is serving $release but expected $EXPECTED_SHA"; exit 1; }
            echo "Production is serving the expected release $EXPECTED_SHA."
          else
            echo "::warning::Production health is good but does not expose BUILDPAIR_BUILD_SHA, so exact deployed-revision verification is unavailable."
          fi

      - name: Verify public API and auth entry points
        shell: bash
        run: |
          set -euo pipefail

          readiness_file=$(mktemp)
          curl --fail --show-error --silent --retry 4 --retry-delay 2 "$BASE_URL/api/readiness" -o "$readiness_file"
          jq -e '.ready == true and .status == "ready"' "$readiness_file" >/dev/null

          traders_file=$(mktemp)
          curl --fail --show-error --silent --retry 4 --retry-delay 2 "$BASE_URL/api/traders" -o "$traders_file"
          jq -e 'type == "array"' "$traders_file" >/dev/null

          jobs_file=$(mktemp)
          curl --fail --show-error --silent --retry 4 --retry-delay 2 "$BASE_URL/api/public/jobs" -o "$jobs_file"
          jq -e 'type == "array"' "$jobs_file" >/dev/null

          curl --fail --show-error --silent --retry 4 --retry-delay 2 "$BASE_URL/auth/sign-in" >/dev/null
          curl --fail --show-error --silent --retry 4 --retry-delay 2 "$BASE_URL/auth/sign-up" >/dev/null

          echo "Production smoke checks passed."
