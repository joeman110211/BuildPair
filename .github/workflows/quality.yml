name: Quality

on:
  push:
    branches:
      - main
      - testing
      - release/web
      - release/android
      - release/ios
  pull_request:
    branches:
      - main
      - testing
      - release/web
      - release/android
      - release/ios

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Reject legacy product branding
        shell: bash
        run: |
          set -euo pipefail
          legacy_name='Build''Mate'
          legacy_slug='build''mate'
          legacy_text="$(grep -RIn --exclude-dir=node_modules --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' --include='*.html' --include='*.svg' --include='*.webmanifest' "$legacy_name" app components constants lib public 2>/dev/null || true)"
          legacy_files="$(find app components constants lib public -type f -iname "*${legacy_slug}*" -print 2>/dev/null || true)"
          if [ -n "$legacy_text" ] || [ -n "$legacy_files" ]; then
            echo "::error::Legacy product branding remains in user-facing application code"
            [ -z "$legacy_text" ] || printf '%s\n' "$legacy_text"
            [ -z "$legacy_files" ] || printf '%s\n' "$legacy_files"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - name: Match repository npm version
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Validate E2E and operations script syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in server.mjs playwright.config.mjs e2e/*.mjs; do
            node --check "$file"
          done
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Export web
        run: npm run build:web
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high --json 2>&1)"
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$output"
              exit 0
            fi

            case "$output" in
              *"Service Unavailable"*|*"ETIMEDOUT"*|*"EAI_AGAIN"*|*"ECONNRESET"*|*"502 Bad Gateway"*|*"503 Service Unavailable"*|*"504 Gateway Timeout"*|*"429 Too Many Requests"*)
                echo "npm audit service unavailable (attempt $attempt/3)"
                if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
                ;;
              *)
                printf '%s\n' "$output"
                exit "$code"
                ;;
            esac
          done

          echo "::warning::npm audit service unavailable after 3 attempts; code/build checks passed"
