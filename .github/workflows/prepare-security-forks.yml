name: Prepare patched security forks

on:
  push:
    branches:
      - security/patch-high-root-vulns-20261011
    paths:
      - .github/workflows/prepare-security-forks.yml
      - scripts/vendor-security-forks.cjs
      - scripts/pin-vendored-lockfile.cjs

permissions:
  contents: write

concurrency:
  group: security-fork-preparation
  cancel-in-progress: false

jobs:
  vendor-reviewed-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Install trusted locked registry packages and apply vulnerability backports
        run: |
          npm ci --no-audit --no-fund
          npm run verify:security-patches
      - name: Copy proven patched sources into local forks, preserving upstream licenses
        run: node scripts/vendor-security-forks.cjs
      - name: Preserve all existing locked versions while linking the two patched forks
        run: node scripts/pin-vendored-lockfile.cjs
      - name: Verify clean fork installation without install-time patch mutation
        run: |
          npm ci --no-audit --no-fund
          npm run verify:security-patches
      - name: Require npm audit to confirm removal of both vulnerable registry packages
        shell: bash
        run: |
          npm audit --omit=dev --json > dependency-security-audit.json || true
          node -e "const a=require('./dependency-security-audit.json');const v=a.metadata?.vulnerabilities;console.log('Remaining advisory counts:',v);console.log('Actual affected packages:',Object.entries(a.vulnerabilities||{}).map(([name,p])=>({name,severity:p.severity,fixAvailable:p.fixAvailable})));if(!v||v.critical||v.high||v.moderate) process.exit(1)"
          rm dependency-security-audit.json
      - name: Build and test production-equivalent web code
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build:web
      - name: Verify Android and iOS Metro bundling
        run: |
          npx expo export --platform android --output-dir dist-android-verified
          npx expo export --platform ios --output-dir dist-ios-verified
      - name: Commit audited fork sources only to the security branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f packages/braces-security packages/node-forge-security package.json package-lock.json
          git diff --cached --check
          git commit -m 'security: vendor verified patched braces and node-forge forks'
          git push origin HEAD:security/patch-high-root-vulns-20261011
