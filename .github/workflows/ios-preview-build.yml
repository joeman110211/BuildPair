name: Build iOS Preview

on:
  push:
    branches: [mobile-build-da8ec8a]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildpair-ios-preview
  cancel-in-progress: true

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
      EXPO_UPDATES_CHANNEL: preview
      EXPO_PUBLIC_API_URL: https://www.buildpair.co.uk
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: qrrcn7ma

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Resolve Expo project id
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_EAS_PROJECT_ID" ]; then
            project_id=$(node -e "console.log(require('./app.json').expo.extra?.eas?.projectId || '')")
            test -n "$project_id" || { echo "::error::Missing Expo/EAS project id"; exit 1; }
            echo "EXPO_EAS_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          fi
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN"; exit 1; }

      - name: Resolve public client configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" ]; then
            config=$(curl --fail --show-error --silent --retry 8 --retry-delay 3 "$EXPO_PUBLIC_API_URL/api/client-config" || true)
            clerk=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty' 2>/dev/null || true)
            stripe=$(printf '%s' "$config" | jq -r '.stripePublishableKey // empty' 2>/dev/null || true)
            if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && [ -n "$clerk" ]; then
              echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$clerk" >> "$GITHUB_ENV"
            fi
            if [ -z "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" ] && [ -n "$stripe" ]; then
              echo "EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=$stripe" >> "$GITHUB_ENV"
            fi
          fi

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund --prefer-offline

      - name: Verify exact BuildPair native identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const app = require('./app.json').expo;
          if (app.ios?.bundleIdentifier !== 'uk.co.buildpair.app') throw new Error(`Unexpected iOS bundle id: ${app.ios?.bundleIdentifier}`);
          if (app.extra?.eas?.projectId !== '2c528c36-07a7-4cad-b367-f23703f9cd47') throw new Error(`Unexpected Expo project id: ${app.extra?.eas?.projectId}`);
          console.log('BuildPair iOS identity verified.');
          NODE
          npm run typecheck

      - name: Verify Expo authentication and project link
        run: |
          npx eas-cli@latest whoami
          npx eas-cli@latest project:info --non-interactive

      - name: Build installable iOS preview through EAS
        run: npx eas-cli@latest build --platform ios --profile preview --non-interactive --wait
