name: UI Evidence

on:
  push:
    branches: [feature/professional-ui-overhaul]

permissions:
  contents: read

concurrency:
  group: buildpair-ui-evidence
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      PORT: '3000'
      APP_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      BUILDPAIR_NOINDEX: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - name: Match repository npm version
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Build web app
        run: npm run build:web
      - name: Install screenshot tooling
        run: npm install --no-save --package-lock=false @playwright/test@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local BuildPair server
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs >/tmp/buildpair-ui-server.log 2>&1 &
          echo $! > /tmp/buildpair-ui-server.pid
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/buildpair-ui-server.log
          exit 1
      - name: Capture desktop and mobile public screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-evidence
          cat > .capture-ui.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';

          const base = 'http://127.0.0.1:3000';
          const routes = [
            ['home', '/'],
            ['directory', '/directory'],
            ['about', '/about'],
            ['how-it-works', '/how-it-works'],
            ['homeowners', '/for-homeowners'],
            ['tradespeople', '/for-tradespeople'],
            ['pricing', '/pricing'],
            ['advice', '/advice'],
            ['building-regulations', '/building-regulations'],
            ['report', '/report'],
            ['trust-safety', '/trust-safety'],
            ['marketplace-standards', '/marketplace-standards'],
            ['contact', '/contact'],
          ];
          await mkdir('ui-evidence', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [label, route] of routes) {
              const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
              await desktop.goto(base + route, { waitUntil: 'networkidle', timeout: 30000 });
              await desktop.screenshot({ path: `ui-evidence/${label}-desktop.png`, fullPage: true });
              await desktop.close();

              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
              await mobile.goto(base + route, { waitUntil: 'networkidle', timeout: 30000 });
              await mobile.screenshot({ path: `ui-evidence/${label}-mobile.png`, fullPage: true });
              await mobile.close();
            }
          } finally {
            await browser.close();
          }
          EOF
          node .capture-ui.mjs
          rm -f .capture-ui.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-ui-evidence-${{ github.run_id }}
          path: |
            ui-evidence
            /tmp/buildpair-ui-server.log
          if-no-files-found: warn
          retention-days: 7
