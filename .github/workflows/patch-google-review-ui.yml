name: Patch Google review UI integration

on:
  push:
    branches:
      - feature/google-reviews-verified-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/google-reviews-verified-20260913
      - name: Apply guarded integration edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one match, found {count}: {old[:90]!r}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'app/trader/_layout.tsx',
              '    <Stack.Screen name="trust" options={{ headerShown: false }} />\n    <Stack.Screen name="analytics" options={{ headerShown: false }} />',
              '    <Stack.Screen name="trust" options={{ headerShown: false }} />\n    <Stack.Screen name="google-reviews" options={{ title: \'Google reviews\' }} />\n    <Stack.Screen name="analytics" options={{ headerShown: false }} />',
          )

          replace_once(
              'app/trader/profile.tsx',
              '        <Link href="/trader/trust" asChild><Button mode="text">Open trust tools →</Button></Link>\n      </AppCard>\n      <AppCard style={[styles.toolCard, styles.toolPortfolio]}>',
              '        <Link href="/trader/trust" asChild><Button mode="text">Open trust tools →</Button></Link>\n      </AppCard>\n      <AppCard style={[styles.toolCard, styles.toolTrust]}>\n        <Text style={styles.eyebrow}>EXISTING REPUTATION</Text>\n        <Text variant="titleLarge" style={styles.title}>Google reviews</Text>\n        <Text style={styles.muted}>Connect the correct Google business listing. Strong matches are verified automatically; anything ambiguous waits for BuildPair admin review before appearing publicly.</Text>\n        <Link href="/trader/google-reviews" asChild><Button mode="text">Manage Google reviews →</Button></Link>\n      </AppCard>\n      <AppCard style={[styles.toolCard, styles.toolPortfolio]}>',
          )

          replace_once(
              'components/TraderProfileStorefront.tsx',
              "import { AppCard } from '@/components/AppCard';\nimport { ProfileShareButtons } from '@/components/ProfileShareButtons';",
              "import { AppCard } from '@/components/AppCard';\nimport { GoogleReviewsPublicCard } from '@/components/GoogleReviewsPublicCard';\nimport { ProfileShareButtons } from '@/components/ProfileShareButtons';",
          )
          replace_once(
              'components/TraderProfileStorefront.tsx',
              '        </SectionCard> : null}\n\n        {showCredentials ? <SectionCard title="Credentials & Insurance">',
              '        </SectionCard> : null}\n\n        <GoogleReviewsPublicCard profileId={profile.id} visible={showReviews && paidProfile} />\n\n        {showCredentials ? <SectionCard title="Credentials & Insurance">',
          )

          replace_once(
              'app/admin/_layout.tsx',
              '            <Stack.Screen name="profiles" />\n            <Stack.Screen name="messages" />',
              '            <Stack.Screen name="profiles" />\n            <Stack.Screen name="google-reviews" />\n            <Stack.Screen name="messages" />',
          )
          replace_once(
              'lib/admin-navigation.ts',
              "      { href: '/admin/profiles', label: 'Trade profiles', shortLabel: 'Profiles', description: 'Review business profiles and the public marketplace information attached to them.' },\n      { href: '/admin/credentials', label: 'Credentials', shortLabel: 'Credentials', description: 'Review uploaded qualifications, registrations and other submitted evidence.' },",
              "      { href: '/admin/profiles', label: 'Trade profiles', shortLabel: 'Profiles', description: 'Review business profiles and the public marketplace information attached to them.' },\n      { href: '/admin/google-reviews', label: 'Google review checks', shortLabel: 'Google', description: 'Approve or reject Google business listings that did not pass automatic profile matching.' },\n      { href: '/admin/credentials', label: 'Credentials', shortLabel: 'Credentials', description: 'Review uploaded qualifications, registrations and other submitted evidence.' },",
          )

          replace_once(
              'app/trader/onboarding.tsx',
              '  trustMark: string;\n  facebook: string;',
              '  trustMark: string;\n  website: string;\n  facebook: string;',
          )
          replace_once(
              'app/trader/onboarding.tsx',
              "  const [trustMark, setTrustMark] = useState('');\n  const [facebook, setFacebook] = useState('');",
              "  const [trustMark, setTrustMark] = useState('');\n  const [website, setWebsite] = useState('');\n  const [facebook, setFacebook] = useState('');",
          )
          replace_once(
              'app/trader/onboarding.tsx',
              "  const [loadingExisting, setLoadingExisting] = useState(true);\n  const [draftReady, setDraftReady] = useState(false);",
              "  const [loadingExisting, setLoadingExisting] = useState(true);\n  const [existingProfile, setExistingProfile] = useState(false);\n  const [draftReady, setDraftReady] = useState(false);",
          )
          replace_once(
              'app/trader/onboarding.tsx',
              "    setTrustMark(draft.trustMark ?? '');\n    setFacebook(draft.facebook ?? '');",
              "    setTrustMark(draft.trustMark ?? '');\n    setWebsite(draft.website ?? '');\n    setFacebook(draft.facebook ?? '');",
          )
          replace_once(
              'app/trader/onboarding.tsx',
              "      setTrustMark(profile.externalLinks?.trustMark ?? '');\n      setFacebook(profile.externalLinks?.facebook ?? '');",
              "      setTrustMark(profile.externalLinks?.trustMark ?? '');\n      setWebsite(profile.externalLinks?.website ?? '');\n      setFacebook(profile.externalLinks?.facebook ?? '');",
          )
          replace_once(
              'app/trader/onboarding.tsx',
              "      setCertified(true);\n      setDraftStatus('Profile loaded');",
              "      setCertified(true);\n      setExistingProfile(true);\n      setDraftStatus('Profile loaded');",
          )
          replace_once(
              'app/trader/onboarding.tsx',
              '    trustMark,\n    facebook,',
              '    trustMark,\n    website,\n    facebook,',
          )
          replace_once(
              'app/trader/onboarding.tsx',
              '  }), [beforeAfterProjects, bio, businessName, coverPhoto, facebook, gasSafe, instagram, logo, photos, postcode, profileImage, qualificationsText, radius, serviceAreasText, serviceSelections, step, tiktok, tradeCategories, tradeCategory, trustMark, whatsapp, yearEstablished, yearsExperience]);',
              '  }), [beforeAfterProjects, bio, businessName, coverPhoto, facebook, gasSafe, instagram, logo, photos, postcode, profileImage, qualificationsText, radius, serviceAreasText, serviceSelections, step, tiktok, tradeCategories, tradeCategory, trustMark, website, whatsapp, yearEstablished, yearsExperience]);',
          )
          replace_once(
              'app/trader/onboarding.tsx',
              '      const links = { gasSafe, trustMark, facebook, instagram, tiktok, whatsapp };',
              '      const links = { gasSafe, trustMark, website, facebook, instagram, tiktok, whatsapp };',
          )
          replace_once(
              'app/trader/onboarding.tsx',
              "      router.replace('/trader/dashboard');",
              "      router.replace(existingProfile ? '/trader/dashboard' : '/trader/google-reviews?onboarding=1');",
          )
          replace_once(
              'app/trader/onboarding.tsx',
              "          ['Gas Safe register URL', gasSafe, setGasSafe],",
              "          ['Business website URL', website, setWebsite],\n          ['Gas Safe register URL', gasSafe, setGasSafe],",
          )

          PY
          rm .github/workflows/patch-google-review-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trader/_layout.tsx app/trader/profile.tsx app/trader/onboarding.tsx components/TraderProfileStorefront.tsx app/admin/_layout.tsx lib/admin-navigation.ts .github/workflows/patch-google-review-ui.yml
          git diff --cached --check
          git commit -m "Wire verified Google reviews into profiles and onboarding"
          git push origin HEAD:feature/google-reviews-verified-20260913
