name: Build Google Play AAB

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD to start a production Google Play bundle build'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buildpair-google-play-aab
  cancel-in-progress: false

jobs:
  build:
    if: github.event.inputs.confirm == 'BUILD'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: https://www.buildpair.co.uk
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: qrrcn7ma
      EXPO_UPDATES_CHANNEL: production

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Require Expo production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN GitHub secret"; exit 1; }
          if [ -z "$EXPO_EAS_PROJECT_ID" ]; then
            project_id=$(node -e "console.log(require('./app.json').expo.extra?.eas?.projectId || '')")
            test -n "$project_id" || { echo "::error::Missing Expo/EAS project id"; exit 1; }
            echo "EXPO_EAS_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          fi

      - name: Resolve client-safe configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" ]; then
            config=$(curl --fail --show-error --silent --retry 8 --retry-delay 3 "$EXPO_PUBLIC_API_URL/api/client-config")
            clerk=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty')
            stripe=$(printf '%s' "$config" | jq -r '.stripePublishableKey // empty')
            if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && [ -n "$clerk" ]; then
              echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$clerk" >> "$GITHUB_ENV"
            fi
            if [ -z "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" ] && [ -n "$stripe" ]; then
              echo "EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=$stripe" >> "$GITHUB_ENV"
            fi
          fi
          test -n "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "::error::Missing Clerk publishable key"; exit 1; }

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund --prefer-offline

      - name: Verify current shared app
        run: |
          npm run typecheck
          npm test

      - name: Verify Google Play contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const app = require('./app.json').expo;
          if (app.android?.package !== 'uk.co.buildpair.app') throw new Error(`Unexpected package ${app.android?.package || 'missing'}`);
          const eas = require('./eas.json');
          if (eas.build?.production?.android?.buildType !== 'app-bundle') throw new Error('Production Android build must remain app-bundle');
          if (eas.build?.production?.channel !== 'production') throw new Error('Production build must use the production OTA channel');
          console.log(`BuildPair ${app.version} · ${app.android.package} · Play AAB contract verified.`);
          NODE

      - name: Verify Expo SDK target API
        shell: bash
        run: |
          set -euo pipefail
          config=$(npx expo config --type public --json)
          printf '%s' "$config" | jq -e '.extra.eas.projectId != null' >/dev/null
          echo 'Expo production configuration resolved.'

      - name: Start signed production AAB build on EAS
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --no-wait

      - name: Next step
        run: echo 'EAS build started. When it finishes, use the resulting signed .aab for Google Play internal or closed testing. Submission remains deliberately separate until the Play Console listing, policy declarations and tester track are ready.'
